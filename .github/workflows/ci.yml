name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# As chaves abaixo são públicas (URL e chave publicável do Supabase): a segurança vem da RLS no banco.
env:
  VITE_SUPABASE_URL: https://qngbgxzpzpxkbdpfbuay.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_Pg7KbDqs9Q875ysjUwIw6A_smK94qvS

jobs:
  app:
    name: App (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (typecheck)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke test
        run: npm run test:e2e
