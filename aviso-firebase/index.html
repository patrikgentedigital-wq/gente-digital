<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quadro de Desempenho mudou de endereço</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f7;
        color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 32rem; padding: 2rem 1.5rem; text-align: left; }
      h1 { margin: 0 0 1rem; font-size: 2rem; line-height: 1.15; letter-spacing: -0.02em; }
      p { margin: 0 0 1rem; font-size: 1.05rem; line-height: 1.5; color: #3a3a3c; }
      a.botao {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.85rem 1.6rem;
        background: #ffe708;
        color: #000;
        font-weight: 700;
        text-decoration: none;
        border-radius: 0 1.5rem 1.5rem 1.5rem;
      }
      a.botao:focus-visible { outline: 3px solid #000; outline-offset: 3px; }
      small { display: block; margin-top: 1.5rem; color: #6e6e73; }
    </style>
  </head>
  <body>
    <main>
      <h1>O Quadro de Desempenho mudou de endereço</h1>
      <p>O sistema agora fica em <strong>quadro-desempenho.vercel.app</strong>. Entre lá com o seu e-mail e a sua senha.</p>
      <a class="botao" href="https://quadro-desempenho.vercel.app/">Abrir o novo endereço</a>
      <small>Ainda não recebeu o seu acesso? Fale com o administrador do sistema.</small>
    </main>
  </body>
</html>
